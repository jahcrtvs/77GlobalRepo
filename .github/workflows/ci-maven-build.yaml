name: 77Global Maven Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 21 using Eclipse Temurin
      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: delacruzex15/pom.xml

      # Step 3: Verify Java installation
      - name: Check Java version
        run: java -version

      # Step 4: Build the project (pom.xml is inside the delacruzex15 folder)
      - name: Build with Maven
        working-directory: delacruzex15
        run: mvn --batch-mode clean package